# ══ 03 · [축2 tactile] lstm → transformer ═════════════════════════════════
# (손가락 × 시각) 토큰에 self-attention. 부위 임베딩과 시간 임베딩을 **따로** 더하므로
# "어느 손가락의 언제"가 attention 안에서 살아 있다 — 접촉이 손가락을 옮겨 가는
# 낙하 회복에서 필요한 정보가 정확히 이것이다.
# horizon 2 에서는 시간축에 볼 게 거의 없으니 07/08(비율 1:2, 1:3)과 같이 봐야 의미가 산다.
_base_: 01_anchor.yaml

obs_spec:
  state:   {kind: state,   keys: ["03_hand_j_pos", "06_hand_j_kin", "30_fruit_pos", "32_fruit_size"], shape: 34, horizon: 2, stride: 6, encoder: mlp}
  rgb:
    kind: vision
    keys: ["40_rgb_jpeg"]
    shape: [3, 224, 224]
    horizon: 2
    stride: 6
    encoder: resnet18
    encoder_kwargs: {pretrained: true, frozen: false, norm: auto, tokens: pool, num_kp: 32}
  tactile:
    kind: tactile
    keys: ["20_paxini_ft"]
    shape: 12
    horizon: 2
    stride: 6
    encoder: transformer
    encoder_kwargs: {n_head: 4, n_layer: 2, use_cls: false, n_part: 4}
