# ══ 13 · v2 모달리티 분리 (11_no_rgb 의 v2 판) ════════════════════════════
# 12 와 데이터·타이밍이 완전히 같고 차이는 하나:
#   12 : 50차원 통짜 obs → 공유 MLP 하나              (모달리티 구분 없음)
#   13 : state(38) / tactile(12) 분리 + 손가락 4토큰   (부위·시간축 보존)
# 두 결과의 차이가 곧 "모달리티 분리 + 손가락 토큰이 값을 하는가"의 답이다.
#
# state 38 = hand_j_pos(16) + hand_j_kin(12) + fruit_pos(3) + fruit_quat(4) + fruit_size(3)
# tactile 12 = 10_hand_paxini_ft (손가락당 Fz,Fx,Fy → 부위-major 라 n_part=4 가 맞다)
_base_: _base.yaml

obs_spec:
  state:
    kind: state
    keys: ["03_hand_j_pos", "06_hand_j_kin", "30_fruit_pos", "31_fruit_quat", "32_fruit_size"]
    shape: 38
    horizon: 2
    stride: 5
    encoder: mlp
  tactile:
    kind: tactile
    keys: ["10_hand_paxini_ft"]
    shape: 12
    horizon: 2
    stride: 5
    encoder: lstm
    encoder_kwargs:
      n_part: 4
      return_seq: true

model:
  fusion: concat
  fusion_kwargs: {pool: flatten}
  denoiser: unet1d
  denoiser_kwargs:
    channels: [64, 128, 256]
  head: diffusion
  head_kwargs:
    diff_steps: 100
    infer_steps: 10

data:
  clamp_spec:
    exp_20260807_031811_lemon_wo_object.h5:
      {0: null, 1: null, 2: null, 3: null, 4: null, 5: DELETE, 6: null,
       7: null, 8: null, 9: null, 10: null, 11: null, 12: null, 13: null}
    exp_20260807_035756_lemon_wo_object_2.h5:
      {0: DELETE, 1: null, 2: null, 3: null, 4: null, 5: null,
       6: null, 7: null, 8: null, 9: null, 10: null, 11: null}

train:
  epochs: 400
  lr: 3.0e-4
