# ══ 09 · 조합 — 01~08 에서 이긴 축들을 합친다 ═════════════════════════════
# ⚠️ 지금 값은 **가설**이다. 01~08 결과 나오면 이긴 쪽으로 고쳐서 돌릴 것.
# 현재 가설: 1:3(하드웨어 실비율) + cross-attn fusion + 접촉 게이팅 + modality dropout.
_base_: 08_freq_1to3.yaml

model:
  fusion: cross_attn
  # pool: flatten — pooled 를 mean 으로 뭉개면 부위·시간 토큰이 사라져서
  # cross-attention 으로 만든 구조가 unet1d 로 넘어가지 않는다.
  fusion_kwargs: {n_head: 4, n_layer: 1, pool: flatten}
  modality_dropout: 0.2
